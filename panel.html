<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AI Chat Navigator</title>
<link rel="icon" href="icons/icon16.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0e0e13;
  --surface:     #14141b;
  --surface2:    #1c1c26;
  --border:      #22222e;
  --border2:     #2e2e3e;
  --text:        #e2e2ef;
  --muted:       #50506a;
  --muted2:      #707089;
  --accent:      #7c6af7;
  --radius:      7px;

  --claude:      #d4956a;
  --gemini:      #5b9cf6;
  --perplexity:  #20b8cd;

  --claude-a:    rgba(212,149,106,.14);
  --gemini-a:    rgba(91,156,246,.14);
  --perplexity-a:rgba(32,184,205,.14);
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
}

/* ═══ HEADER ═══════════════════════════════════════════ */
header {
  padding: 14px 14px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 9px;
}



h1 { font-size: 15px; font-weight: 700; flex: 1; letter-spacing: -.01em; }

#total-badge {
  font-size: 12px; font-weight: 600;
  color: var(--muted2);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 3px 11px;
}

/* ═══ SITE PILLS ════════════════════════════════════════ */
.site-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted2);
  transition: all .15s;
  user-select: none;
  white-space: nowrap;
}
.pill:hover { color: var(--text); border-color: var(--border2); }

/* "All" pill */
.pill[data-site="all"].active { color: var(--text); border-color: var(--accent); background: rgba(124,106,247,.14); }

/* site pills — dim until data arrives */
.pill[data-site="claude"]     { --c: var(--claude);     --ca: var(--claude-a); }
.pill[data-site="gemini"]     { --c: var(--gemini);     --ca: var(--gemini-a); }
.pill[data-site="perplexity"] { --c: var(--perplexity); --ca: var(--perplexity-a); }

.pill[data-site]:not([data-site="all"]).cached { color: var(--c); }
.pill[data-site]:not([data-site="all"]).active  { color: var(--c); border-color: var(--c); background: var(--ca); }

.pill-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .2s;
}
.pill.cached .pill-dot { background: var(--c, var(--accent)); }

.pill-count {
  font-size: 11px; opacity: .75;
}

/* ═══ TOOLBAR ════════════════════════════════════════════ */
.toolbar {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.search-wrap { flex: 1; position: relative; }
.search-wrap svg {
  position: absolute; left: 9px; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  color: var(--muted); pointer-events: none;
}
#search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 8px 10px 8px 32px;
  outline: none;
  transition: border-color .15s;
}
#search::placeholder { color: var(--muted); }
#search:focus { border-color: var(--accent); }

#refresh-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .15s;
}
#refresh-btn:hover { border-color: var(--accent); }
#refresh-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
#refresh-btn.spinning svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══ TABLE ══════════════════════════════════════════════ */
.table-wrap {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.table-wrap::-webkit-scrollbar { width: 5px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

table { width: 100%; border-collapse: collapse; table-layout: fixed; }

thead {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 2px solid var(--border2);
}
th {
  font-size: 11px; font-weight: 600;
  color: var(--muted2);
  letter-spacing: .07em;
  text-transform: uppercase;
  text-align: left;
  padding: 9px 12px;
  white-space: nowrap;
  user-select: none;
  cursor: pointer;
}
th:hover { color: var(--text); }
th.sorted { color: var(--text); }
th:nth-child(1) { width: 104px; }
th:nth-child(2) { width: auto; }
th:nth-child(3) { width: 76px; text-align: right; }

tbody tr {
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody tr:hover .open-hint { opacity: 1; }

td { padding: 10px 12px; font-size: 14px; vertical-align: middle; overflow: hidden; }

/* site chip */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
tr[data-site="claude"]     .chip { color:var(--claude);     background:var(--claude-a); }
tr[data-site="gemini"]     .chip { color:var(--gemini);     background:var(--gemini-a); }
tr[data-site="perplexity"] .chip { color:var(--perplexity); background:var(--perplexity-a); }

.chip-dot { width: 5px; height: 5px; border-radius: 50%; }
tr[data-site="claude"]     .chip-dot { background:var(--claude); }
tr[data-site="gemini"]     .chip-dot { background:var(--gemini); }
tr[data-site="perplexity"] .chip-dot { background:var(--perplexity); }

.title-td {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text); max-width: 0;
}
.open-hint { opacity: 0; font-size: 11px; color: var(--accent); margin-left: 6px; transition: opacity .1s; }
.age-td { color: var(--muted2); font-size: 12px; text-align: right; white-space: nowrap; }

/* selected row */
tbody tr.selected { background: rgba(124,106,247,.1); }
tbody tr.selected td { color: var(--text); }
tbody tr.selected .open-hint { opacity: 1; color: var(--muted2); content: "dbl↗"; }
tbody tr.selected::after { content: ''; }

/* ═══ EMPTY STATE ════════════════════════════════════════ */
.empty {
  padding: 40px 16px;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
}
.empty-icon { font-size: 40px; }
.empty-title { font-size: 17px; font-weight: 700; }
.empty-sub { font-size: 13px; color: var(--muted2); line-height: 1.75; max-width: 300px; }

.site-status-list {
  display: flex; flex-direction: column; gap: 7px;
  width: 100%; max-width: 340px; margin-top: 4px;
}
.site-status-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 13px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface2);
  text-decoration: none; color: var(--text);
  transition: background .15s;
  cursor: pointer;
}
.site-status-row:hover { background: var(--border2); }
.site-status-left { display: flex; align-items: center; gap: 10px; }
.status-indicator {
  width: 9px; height: 9px; border-radius: 50%;
  flex-shrink: 0;
}
.status-indicator.ok     { background: #4ade80; }
.status-indicator.open   { background: #facc15; }
.status-indicator.empty  { background: var(--muted); }
.site-status-name { font-size: 14px; font-weight: 600; }
.site-status-note { font-size: 12px; color: var(--muted2); }
.open-arrow { font-size: 13px; color: var(--muted2); }

/* ═══ FOOTER ══════════════════════════════════════════════ */
footer {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  font-size: 11px;
  color: var(--muted2);
  flex-shrink: 0;
}

/* ═══ DISTILLER ══════════════════════════════════════════════════════════════ */
.distill-bar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.distill-buttons {
  display: flex;
  gap: 8px;
}

.distill-btn-base {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex: 1;
  justify-content: center;
  transition: all .15s;
}
.distill-btn-base:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.distill-btn-base:disabled { opacity: .4; cursor: not-allowed; }
.distill-btn-base.loading { opacity: .6; cursor: wait; }
.distill-btn-base svg { width: 13px; height: 13px; flex-shrink: 0; }

#open-btn { border-color: rgba(74,222,128,.35); }
#open-btn:hover:not(:disabled) { background: rgba(74,222,128,.1); border-color: #4ade80; color: #4ade80; }

#distill-btn  { border-color: rgba(124,106,247,.4); }
#distill-btn:hover:not(:disabled)  { background: rgba(124,106,247,.1); border-color: var(--accent); color: var(--accent); }

#deepdive-btn { border-color: rgba(91,156,246,.3); }
#deepdive-btn:hover:not(:disabled) { background: rgba(91,156,246,.1); border-color: var(--gemini); color: var(--gemini); }

.distill-status {
  font-size: 11px;
  padding: 4px 2px;
  border-radius: 4px;
  display: none;
  line-height: 1.5;
}
.distill-status.info { color: var(--muted2); }
.distill-status.warn { color: #f0a500; }
.distill-status.ok   { color: #4ade80; }

mark { background: rgba(124,106,247,.3); color: inherit; border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <img src="icons/icon48.png" style="width:30px;height:30px;border-radius:8px;flex-shrink:0;">
    <h1>AI Chat Navigator</h1>
    <span id="total-badge">—</span>
  </div>

  <div class="site-row" id="site-row">
    <span class="pill active" data-site="all">All</span>
    <span class="pill" data-site="claude"><span class="pill-dot"></span>Claude</span>
    <span class="pill" data-site="gemini"><span class="pill-dot"></span>Gemini</span>
    <span class="pill" data-site="perplexity"><span class="pill-dot"></span>Perplexity</span>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="search" placeholder="Search all chats…" autocomplete="off" spellcheck="false"/>
  </div>
  <button id="refresh-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
    </svg>
    Refresh
  </button>
</div>

<div class="distill-bar">
  <div class="distill-buttons">
    <button class="distill-btn-base" id="open-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/>
      </svg>
      Open
    </button>
    <button class="distill-btn-base" id="distill-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/>
      </svg>
      Quick Distill
    </button>
    <button class="distill-btn-base" id="deepdive-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6M8 11h6"/>
      </svg>
      Deep Dive
    </button>
  </div>
  <div class="distill-status info" id="distill-status"></div>
</div>

<div class="table-wrap" id="table-wrap"></div>

<footer>
  <span id="footer-label">Loading…</span>
</footer>

<script src="panel.js"></script>
</body>
</html>
